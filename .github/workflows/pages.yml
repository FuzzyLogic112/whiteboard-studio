# 把 site/ 下的静态展示页发布到 GitHub Pages。
#
# 只是一个展示页，不是可用的应用——这个项目需要 Python 后端和一个会启无头
# Chromium 的渲染进程，Pages 只能托管静态文件。真要跑起来见仓库的「快速开始」。
name: Deploy showcase to Pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同时只跑一个部署；新的推送不打断正在进行的发布
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
