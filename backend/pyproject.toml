[project]
name = "whiteboard-studio-backend"
version = "0.1.0"
description = "whiteboard-studio 的文稿处理与渲染调度后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    # 位图配图的矢量化：Pillow 读图，numpy 跑 Zhang-Suen 细化
    "pillow>=10.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
# 分词词典是运行时必需的资源，不能只留在源码树里
"app" = ["pipeline/data/*.txt.gz"]
